name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        # Firebase web config (VITE_FIREBASE_*) is committed in .env.production -
        # it's not a server-side secret (Firebase's own docs: client web config
        # is safe to expose; access control lives in firestore.rules), and Vite
        # loads it automatically for a production build. Do NOT reintroduce
        # these as GitHub Actions secrets/env vars here: an unset secret
        # resolves to an empty string, and process.env overrides .env file
        # values, so a missing secret would silently blank out the working
        # config committed below.

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEODRAW_GAME_7392 }}'
          channelId: live
          projectId: geodraw-game-7392
